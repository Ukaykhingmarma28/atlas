[package]
name = "atlas-memory"
version = "0.1.0"
edition = "2021"
description = "Atlas's on-device RAG/memory engine: MiniLM → usearch HNSW + grafeo graph memory, behind the MemorySearchFn seam."

[lib]
name = "atlas_memory"

[dependencies]
# Embedded graph database behind `graph::GraphMemory` (relationships, topic
# tags). The `lpg` feature is what provides the actual graph store — without it
# `GrafeoDB::open` panics with "no graph store available". `lpg` already implies
# gql + storage (wal/grafeo-file).
grafeo = { version = "0.5", default-features = false, features = ["lpg", "gql", "grafeo-file", "wal"] }
# Timestamps on graph nodes + the memdir date headers.
chrono = { version = "0.4", features = ["serde"] }
# Memory-node ids.
uuid = { version = "1", features = ["v4"] }
# `embedding::EmbeddingError`.
thiserror = "2"
# The persistent HNSW vector index — has native save/load/remove (hard deletes).
usearch = "2.25.3"
# On-device MiniLM embedder (384-d, CPU). The `MiniLmProvider` wraps this.
atlas-embed = { path = "../atlas-embed" }

# The shared-memory record store (`record`): one WAL database per scope.
# Pinned to the one rusqlite the workspace resolves — the canonical statement of
# the pin and why is in `crates/atlas-thread-metadata/Cargo.toml` (#39).
rusqlite = { version = "0.39", features = ["bundled"] }
# Every record-store write is scrubbed through Atlas's one redactor.
atlas-redact = { path = "../atlas-redact" }
# Normalised content hash of an entry (its identity when no key is given).
sha2 = "0.10"

async-trait = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"

# The workspace lint table is only real for members that opt in —
# without this stanza it is dead configuration (#60).
[lints]
workspace = true
