#:schema ../schema/theme-v1.json
schema = 1
id = "atlas"
name = "Atlas"
author = "Atlas contributors"
license = "Apache-2.0"

[dark.base]
"background" = "#000000"
"foreground" = "#ffffff"
"card" = "#0f0f0f"
"card-foreground" = "#ffffff"
"popover" = "#1c1c1c"
"popover-foreground" = "#ffffff"
"primary" = "#ffffff"
"primary-foreground" = "#000000"
"secondary" = "#0f0f0f"
"secondary-foreground" = "#aaaaaa"
"muted" = "#171717"
"muted-foreground" = "#585858"
"accent" = "#171717"
"accent-foreground" = "#ffffff"
"destructive" = "#f44747"
"destructive-foreground" = "#000000"
"border" = "#1e1e1e"
"input" = "#1e1e1e"
"ring" = "#ffffff"
"chart-1" = "#ffff00"
"chart-2" = "#9ecf8a"
"chart-3" = "#e0b070"
"chart-4" = "#c9a2f5"
"chart-5" = "#7fd1e8"
"sidebar" = "#0a0a0a"
"sidebar-foreground" = "#ffffff"
"sidebar-primary" = "#ffffff"
"sidebar-primary-foreground" = "#000000"
"sidebar-accent" = "#0f0f0f"
"sidebar-accent-foreground" = "#ffffff"
"sidebar-border" = "#141414"
"sidebar-ring" = "#ffffff"
"radius" = "8px"
"font-sans" = "-apple-system, \"SF Pro Text\", system-ui, sans-serif"
"font-serif" = "ui-serif, Georgia, Cambria, \"Times New Roman\", serif"
"font-mono" = "\"SF Mono\", \"Geist Mono\", \"JetBrains Mono\", monospace"
"tracking-normal" = "0em"
"spacing" = "0.25rem"
"shadow-2xs" = "0 1px 2px rgba(0, 0, 0, 0.35)"
"shadow-xs" = "0 1px 2px rgba(0, 0, 0, 0.45)"
"shadow-sm" = "0 1px 3px rgba(0, 0, 0, 0.55)"
"shadow-md" = "0 4px 12px rgba(0, 0, 0, 0.65)"
"shadow-lg" = "0 8px 24px rgba(0, 0, 0, 0.75)"
"shadow-xl" = "0 12px 36px rgba(0, 0, 0, 0.82)"
"shadow-2xl" = "0 16px 48px rgba(0, 0, 0, 0.9)"

[dark.palette]
red = "#f44747"
orange = "#e0b070"
yellow = "#ffff00"
green = "#9ecf8a"
cyan = "#7fd1e8"
blue = "#6796e6"
purple = "#c9a2f5"
pink = "#e59a72"

[dark.keys]
"border.subtle" = "#141414"
"border.strong" = "#3d3d3d"
"text.disabled" = "#333333"
"panel.background" = "#0a0a0a"
"panel.input.background" = "#0a0a0a"
"editor.background" = "#000000"
"editor.foreground" = "#d4d4d4"
"editor.caret" = "#d4d4d4"
"editor.gutter.background" = "#000000"
"editor.gutter.foreground" = "#666666"
"editor.active_line.background" = "#ffffff0a"
"editor.active_line.gutter_foreground" = "#d4d4d4"
"editor.selection.background" = "#303030"
"editor.match_bracket.background" = "#2d2d2d"
"editor.match_bracket.border" = "#3d3d3d"
"syntax.comment" = "#8f8f8f"
"syntax.keyword" = "#c9a2f5"
"syntax.string" = "#9ecf8a"
"syntax.number" = "#e0b070"
"syntax.type" = "#7fd1e8"
"syntax.function" = "#ffff00"
"syntax.variable" = "#eaeaea"
"syntax.operator" = "#9a9a9a"
"syntax.tag" = "#7fd1e8"
"syntax.attribute" = "#d9b47a"
"syntax.constant" = "#e0b070"
"syntax.regexp" = "#e59a72"
"syntax.escape" = "#e59a72"
"syntax.definition" = "#ffffff"
"syntax.property" = "#c8c8c8"
"diff.added.background" = "#0d2211"
"diff.removed.background" = "#220d0d"
"diff.context.background" = "#0a0a0a"
"diff.added.emphasis" = "rgba(52,211,153,0.34)"
"diff.removed.emphasis" = "rgba(244,63,63,0.34)"

