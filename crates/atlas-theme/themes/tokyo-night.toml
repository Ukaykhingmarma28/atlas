"font-mono" = "\"SF Mono\", \"Geist Mono\", \"JetBrains Mono\", monospace"
"tracking-normal" = "0em"
"spacing" = "0.25rem"
"shadow-2xs" = "0 1px 2px rgba(0, 0, 0, 0.35)"
"shadow-xs" = "0 1px 2px rgba(0, 0, 0, 0.45)"
"shadow-sm" = "0 1px 3px rgba(0, 0, 0, 0.55)"
"shadow-md" = "0 4px 12px rgba(0, 0, 0, 0.65)"
"shadow-lg" = "0 8px 24px rgba(0, 0, 0, 0.75)"
"shadow-xl" = "0 12px 36px rgba(0, 0, 0, 0.82)"
"shadow-2xl" = "0 16px 48px rgba(0, 0, 0, 0.9)"

[dark.palette]
red = "#f7768e"
orange = "#ff9e64"
yellow = "#e0af68"
green = "#9ece6a"
cyan = "#7dcfff"
blue = "#7aa2f7"
purple = "#bb9af7"
pink = "#ff007c"

[dark.keys]
"border.subtle" = "#16161e"
"border.strong" = "#7aa2f7"
"panel.background" = "#1a1b26"
"panel.input.background" = "#1a1b26"
"editor.background" = "#1a1b26"
"editor.foreground" = "#c0caf5"
"editor.caret" = "#c0caf5"
"editor.gutter.background" = "#1a1b26"
"editor.gutter.foreground" = "#565f89"
"editor.active_line.background" = "#ffffff0a"
"editor.active_line.gutter_foreground" = "#a9b1d6"
"editor.selection.background" = "#33467c"
"editor.match_bracket.background" = "#292e42"
"editor.match_bracket.border" = "#7aa2f7"
"syntax.comment" = "#565f89"
"syntax.keyword" = "#bb9af7"
"syntax.string" = "#9ece6a"
"syntax.number" = "#ff9e64"
"syntax.type" = "#2ac3de"
"syntax.function" = "#7aa2f7"
"syntax.variable" = "#c0caf5"
"syntax.operator" = "#89ddff"
