#:schema ../schema/theme-v1.json
schema = 1
id = "tokyo-night"
name = "Tokyo Night"
author = "Tokyo Night"
license = "MIT"

[dark.base]
"background" = "#1a1b26"
"foreground" = "#c0caf5"
"card" = "#16161e"
"card-foreground" = "#c0caf5"
"popover" = "#292e42"
"popover-foreground" = "#c0caf5"
"primary" = "#7aa2f7"
"primary-foreground" = "#1a1b26"
"secondary" = "#16161e"
"secondary-foreground" = "#565f89"
"muted" = "#16161e"
"muted-foreground" = "#565f89"
"accent" = "#16161e"
"accent-foreground" = "#c0caf5"
"destructive" = "#f7768e"
"destructive-foreground" = "#1a1b26"
"border" = "#292e42"
"input" = "#292e42"
"ring" = "#7aa2f7"
"chart-1" = "#7aa2f7"
"chart-2" = "#9ece6a"
"chart-3" = "#ff9e64"
"chart-4" = "#bb9af7"
"chart-5" = "#f7768e"
"sidebar" = "#1a1b26"
"sidebar-foreground" = "#c0caf5"
"sidebar-primary" = "#7aa2f7"
"sidebar-primary-foreground" = "#1a1b26"
"sidebar-accent" = "#16161e"
"sidebar-accent-foreground" = "#c0caf5"
"sidebar-border" = "#16161e"
"sidebar-ring" = "#7aa2f7"
"radius" = "8px"
"font-sans" = "-apple-system, \"SF Pro Text\", system-ui, sans-serif"
