#:schema ../schema/theme-v1.json
schema = 1
id = "atlas-mono"
name = "Atlas Mono"
author = "Atlas contributors"
license = "Apache-2.0"

[dark.base]
"background" = "#000000"
"foreground" = "#d0d0d0"
"card" = "#1a1a1a"
"card-foreground" = "#d0d0d0"
"popover" = "#2d2d2d"
"popover-foreground" = "#d0d0d0"
"primary" = "#ffff00"
"primary-foreground" = "#000000"
"secondary" = "#1a1a1a"
"secondary-foreground" = "#8a8a8a"
"muted" = "#1a1a1a"
"muted-foreground" = "#8a8a8a"
"accent" = "#1a1a1a"
"accent-foreground" = "#d0d0d0"
"destructive" = "#b0b0b0"
"destructive-foreground" = "#000000"
"border" = "#2a2a2a"
"input" = "#2a2a2a"
"ring" = "#ffff00"
"chart-1" = "#ffff00"
"chart-2" = "#e6e6e6"
"chart-3" = "#c2c2c2"
"chart-4" = "#a8a8a8"
"chart-5" = "#8a8a8a"
"sidebar" = "#000000"
"sidebar-foreground" = "#d0d0d0"
"sidebar-primary" = "#ffff00"
"sidebar-primary-foreground" = "#000000"
"sidebar-accent" = "#1a1a1a"
"sidebar-accent-foreground" = "#d0d0d0"
"sidebar-border" = "#1a1a1a"
"sidebar-ring" = "#ffff00"
"radius" = "8px"
"font-sans" = "-apple-system, \"SF Pro Text\", system-ui, sans-serif"
"font-serif" = "ui-serif, Georgia, Cambria, \"Times New Roman\", serif"
"font-mono" = "\"SF Mono\", \"Geist Mono\", \"JetBrains Mono\", monospace"
"tracking-normal" = "0em"
"spacing" = "0.25rem"
"shadow-2xs" = "0 1px 2px rgba(0, 0, 0, 0.35)"
"shadow-xs" = "0 1px 2px rgba(0, 0, 0, 0.45)"
"shadow-sm" = "0 1px 3px rgba(0, 0, 0, 0.55)"
"shadow-md" = "0 4px 12px rgba(0, 0, 0, 0.65)"
"shadow-lg" = "0 8px 24px rgba(0, 0, 0, 0.75)"
"shadow-xl" = "0 12px 36px rgba(0, 0, 0, 0.82)"
"shadow-2xl" = "0 16px 48px rgba(0, 0, 0, 0.9)"

[dark.palette]
red = "#b0b0b0"
orange = "#c2c2c2"
yellow = "#d4d4d4"
green = "#b0b0b0"
cyan = "#9c9c9c"
blue = "#a8a8a8"
purple = "#e6e6e6"
pink = "#b0b0b0"

[dark.keys]
"border.default" = "#2a2a2a"
"border.subtle" = "#1a1a1a"
"border.strong" = "#3d3d3d"
"border.focus" = "#3d3d3d"
"border.variant" = "#1a1a1a"
"text.muted" = "#8a8a8a"
"text.placeholder" = "#666666"
"text.disabled" = "#1a1a1a"
"text.accent" = "#d4d4d4"
"panel.rail.background" = "#000000"
"panel.background" = "#000000"
"panel.elevated.background" = "#1a1a1a"
"panel.overlay.background" = "#2d2d2d"
"panel.input.background" = "#000000"
"tab.active.background" = "#1a1a1a"
"tab.inactive.background" = "#000000"
"tab.active.border" = "#ffff00"
"editor.background" = "#000000"
"editor.foreground" = "#d0d0d0"
"editor.caret" = "#d0d0d0"
"editor.gutter.background" = "#000000"
"editor.gutter.foreground" = "#666666"
"editor.active_line.background" = "#ffffff0a"
"editor.active_line.gutter_foreground" = "#d0d0d0"
"editor.selection.background" = "#303030"
"editor.match_bracket.background" = "#2d2d2d"
"editor.match_bracket.border" = "#3d3d3d"
"editor.fold.background" = "#1a1a1a"
"editor.fold.border" = "#2a2a2a"
"editor.fold.foreground" = "#8a8a8a"
"syntax.comment" = "#8a8a8a"
"syntax.keyword" = "#e6e6e6"
"syntax.string" = "#b0b0b0"
"syntax.number" = "#c2c2c2"
"syntax.type" = "#d4d4d4"
"syntax.function" = "#ffff00"
"syntax.variable" = "#ffffff"
"syntax.operator" = "#9c9c9c"
"syntax.tag" = "#d4d4d4"
"syntax.attribute" = "#a8a8a8"
"syntax.constant" = "#c2c2c2"
"syntax.regexp" = "#b0b0b0"
"syntax.escape" = "#b0b0b0"
"syntax.definition" = "#ffffff"
"syntax.property" = "#c8c8c8"
"syntax.boolean" = "#c2c2c2"
"syntax.null" = "#c2c2c2"
"diff.add_line.background" = "#0d2211"
"diff.remove_line.background" = "#220d0d"
"diff.context.background" = "#0a0a0a"
"diff.add_side.background" = "rgba(34,197,94,0.13)"
"diff.remove_side.background" = "rgba(244,63,63,0.13)"
"diff.emphasis_added.background" = "rgba(52,211,153,0.34)"
"diff.emphasis_removed.background" = "rgba(244,63,63,0.34)"

