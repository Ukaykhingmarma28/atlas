"destructive" = "#e78284"
"destructive-foreground" = "#303446"
"border" = "#414559"
"input" = "#414559"
"ring" = "#8caaee"
"chart-1" = "#8caaee"
"chart-2" = "#a6d189"
"chart-3" = "#ef9f76"
"chart-4" = "#ca9ee6"
