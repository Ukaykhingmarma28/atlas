"destructive" = "#f28779"
"destructive-foreground" = "#090a12"
"border" = "#28282f"
"input" = "#28282f"
"ring" = "#8b9cf0"
"chart-1" = "#73d0ff"
"chart-2" = "#bbe67e"
"chart-3" = "#ffae57"
"chart-4" = "#d4bfff"
"chart-5" = "#f28779"
"sidebar" = "#0e0e12"
