"secondary" = "#171109"
"secondary-foreground" = "#a99f8c"
"muted" = "#1d1610"
"muted-foreground" = "#4c4636"
"accent" = "#1d1610"
"accent-foreground" = "#ece5d5"
"destructive" = "#f44747"
"destructive-foreground" = "#140f06"
"border" = "#2a2114"
"input" = "#2a2114"
"ring" = "#c9a35a"
"chart-1" = "#c9a35a"
"chart-2" = "#98c379"
"chart-3" = "#d19a66"
"chart-4" = "#c678dd"
"chart-5" = "#e06c75"
"sidebar" = "#100c07"
"sidebar-foreground" = "#ece5d5"
